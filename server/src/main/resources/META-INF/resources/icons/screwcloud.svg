<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="screwcloud-title">
  <title id="screwcloud-title">ScrewCloud</title>

  <!--
    Ruuvi porautuu pilveen. Kaksi lukutapaa: ruuvi on rautaa, ja itse
    hostattu sovellus ruuvaa pilven kiinni omalle palvelimelle.

    Värit ovat kiinteitä eikä currentColoria käytetä, koska logo näytetään
    <img>-elementissä eikä ulkoinen SVG peri sivun tekstiväriä. Paletti on
    valittu erottumaan sekä vaalealla että tummalla taustalla.

    Piirtojärjestys on merkityksellinen: varsi ensin, pilvi päälle, kanta
    viimeisenä. Silloin varsi katoaa pilven taakse ja ruuvi näyttää olevan
    pilven sisällä.
  -->

  <!-- ruuvin varsi ja kierteet, kärki alaspäin ja koko ruuvi kallistettuna -->
  <g transform="translate(48 8) rotate(30)">
    <path d="M -4 5 L 4 5 L 2.6 24 L 0 31 L -2.6 24 Z" fill="#E0A33E"/>
    <g stroke="#A9741B" stroke-width="1.3" stroke-linecap="round">
      <line x1="-3.8" y1="9" x2="3.8" y2="10"/>
      <line x1="-3.6" y1="13" x2="3.6" y2="14"/>
      <line x1="-3.3" y1="17" x2="3.3" y2="18"/>
      <line x1="-3.0" y1="21" x2="3.0" y2="22"/>
    </g>
  </g>

  <!-- pilvi -->
  <g fill="#9FB3C8">
    <circle cx="32" cy="34" r="13"/>
    <circle cx="19" cy="40" r="9"/>
    <circle cx="46" cy="39" r="9.5"/>
    <rect x="10" y="39" width="46" height="12" rx="6"/>
  </g>

  <!-- ruuvin kanta ja ura -->
  <g transform="translate(48 8) rotate(30)">
    <circle cx="0" cy="0" r="7.5" fill="#EFB65A" stroke="#A9741B" stroke-width="1.4"/>
    <rect x="-5" y="-1.4" width="10" height="2.8" rx="1.4" fill="#8C5E12"/>
  </g>
</svg>
