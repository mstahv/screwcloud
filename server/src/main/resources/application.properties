server.port=8080

# Port the sensor devices send to. Use the same value in the device config.h.
sensorhub.udp.port=5555

# ----------------------------------------------------------------------------
# Database
#
# PostgreSQL, with the defaults of a plain "apt install postgresql" on Ubuntu:
# port 5432, the postgres role, the postgres database. A server database is a
# service at a known address rather than a file in some directory, which is the
# whole reason for moving off H2 — a file database silently became a different
# file whenever the working directory changed.
#
# Ubuntu's default pg_hba.conf uses peer authentication on the unix socket and
# scram-sha-256 for TCP. JDBC always connects over TCP, so the postgres role
# needs a password even on localhost:
#
#   sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'secret'"
#
# The password below is only a development placeholder. Override it — and
# anything else — with environment variables, which Spring maps automatically:
#
#   SPRING_DATASOURCE_PASSWORD=secret java -jar sensor-hub.jar
#
# In development you normally do not touch these at all: TestServer starts a
# PostgreSQL container and injects its own connection details, which take
# precedence over everything here.
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns the schema, not Hibernate. validate checks at startup that the
# entities match the database but never modifies it — ddl-auto=update would
# quietly bend in the wrong directions and not report what it did.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate is deliberately NOT set. It existed for H2 files created
# before Flyway was introduced, and there are none on PostgreSQL. Leaving it off
# means Flyway refuses to start against a schema that already has tables but no
# history, instead of assuming they are the right ones.

# The views use DTO records rather than entities, so there is no need to keep a
# session open for the duration of rendering.
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Web push notifications
#
# The VAPID key pair identifies this server to the browsers' push services. It
# is a credential: the private key must not be committed, which is why these
# come from the environment and default to empty.
#
# Generate a pair with (no Node needed):
#
#   java tools/generate-vapid-keys.java
#
# Then run with:
#
#   VAPID_PUBLIC_KEY=B... VAPID_PRIVATE_KEY=... \
#   VAPID_SUBJECT=mailto:you@example.com java -jar sensor-hub.jar
#
# With no keys set, notifications are simply unavailable: the switch is hidden
# and everything else works as before. The subject is required by Apple's push
# service and has to be a mailto: or https: URL.
# ----------------------------------------------------------------------------
sensorhub.webpush.public-key=${VAPID_PUBLIC_KEY:}
sensorhub.webpush.private-key=${VAPID_PRIVATE_KEY:}
sensorhub.webpush.subject=${VAPID_SUBJECT:}

# ----------------------------------------------------------------------------
# Retention
#
# The nightly sweep that keeps the database the size of its living content.
# Three independent ages, all Durations ("365d", "90d", "8760h"):
#
#   samples   how long measurements are kept. This is the knob that decides
#             the disk: one sample row costs ~0.3 kB with its indexes, and a
#             device reporting every 5 minutes with three sensors writes
#             ~860 rows a day — about 95 MB a year. A thousand such devices
#             are ~95 GB/year, which is why this defaults to one year rather
#             than forever.
#   devices   a device whose newest measurement is older than this is removed
#             with everything it owns (settings, counters, listings, alert
#             subscriptions). A device that never reported expires by the age
#             of its newest listing instead.
#   clients   a browser token not seen on the pages for this long is
#             forgotten: device list, push subscriptions, alert choices.
#             Receiving notifications does not count as being seen.
#
# The cron moves the sweep or, set to "-", disables it entirely.
# ----------------------------------------------------------------------------
sensorhub.retention.samples=365d
sensorhub.retention.devices=365d
sensorhub.retention.clients=365d
sensorhub.retention.cron=0 12 4 * * *

# ----------------------------------------------------------------------------
# Firmware builds
#
# The page that builds a configured .uf2 for somebody's device runs arduino-cli
# on this machine. What to install is in the README under "Building firmware on
# the server" — a one-time install, and the easiest thing to get subtly wrong is
# the user it happens as.
#
# NOTHING HERE HAS TO BE SET. The defaults are where a normal install puts
# things: arduino-cli on the path, its data in the service user's home. The
# settings exist so a deployment that put them elsewhere can say so.
#
# With no toolchain found the feature is simply unavailable — the page is not
# offered and everything else works as before, the same arrangement as the VAPID
# keys above. The check happens at startup, so a path set wrongly is reported
# then rather than by the first person to press the button.
# ----------------------------------------------------------------------------

# Empty means "look for it": on the path, then ~/bin, then /usr/local/bin.
sensorhub.firmware.arduino-cli=${ARDUINO_CLI:}

# Where the core and the libraries live, and what every build is given as
# ARDUINO_DIRECTORIES_DATA. The default is also arduino-cli's own, so a command
# typed by hand finds the same core the service does.
sensorhub.firmware.data-dir=${ARDUINO_DATA_DIR:${user.home}/.arduino15}

# Where the clone, the working copy, the build directory and finished artifacts
# live. Three of those are reused between builds, which is what keeps a rebuild
# to seconds rather than the minute a cold one takes: arduino-cli recompiles only
# what changed, and between two builds that is a config.h of forty bytes. The
# working copy is refreshed only when the commit behind it moves, because a
# sketch copied to a new path is a sketch that has entirely changed as far as the
# dependency files are concerned.
#
# Under the service user's home, because that is the one directory it certainly
# owns. A path under /var/lib would have to be created and chowned as root
# first, and forgetting that shows up as a permission error during somebody
# else's first build rather than during the install.
sensorhub.firmware.work-dir=${FIRMWARE_WORK_DIR:${user.home}/screwcloud-builds}

# The source the builds come from. A clone is kept and fetched before a build;
# the clone is never the build directory.
sensorhub.firmware.source-repo=https://github.com/mstahv/screwcloud.git
sensorhub.firmware.source-branch=main

# One build at a time. The queue limit is what a full queue answers with — that
# is a normal condition ("busy, try again in a minute") and not an error. The
# timeout ends a build that is not going to finish.
sensorhub.firmware.queue-limit=5
sensorhub.firmware.timeout=5m

# How long a finished image is kept. It contains somebody's WiFi password in
# clear text, so it should not outlive the errand: it is deleted when the reader
# leaves the build page, and swept at this age if a tab was left open.
sensorhub.firmware.artifact-ttl=15m

logging.level.fi.mstahv.sensorhub=INFO
