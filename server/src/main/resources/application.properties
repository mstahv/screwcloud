server.port=8080

# Port the sensor devices send to. Use the same value in the device config.h.
sensorhub.udp.port=5555

# ----------------------------------------------------------------------------
# Database
#
# PostgreSQL, with the defaults of a plain "apt install postgresql" on Ubuntu:
# port 5432, the postgres role, the postgres database. A server database is a
# service at a known address rather than a file in some directory, which is the
# whole reason for moving off H2 — a file database silently became a different
# file whenever the working directory changed.
#
# Ubuntu's default pg_hba.conf uses peer authentication on the unix socket and
# scram-sha-256 for TCP. JDBC always connects over TCP, so the postgres role
# needs a password even on localhost:
#
#   sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'secret'"
#
# The password below is only a development placeholder. Override it — and
# anything else — with environment variables, which Spring maps automatically:
#
#   SPRING_DATASOURCE_PASSWORD=secret java -jar sensor-hub.jar
#
# In development you normally do not touch these at all: TestServer starts a
# PostgreSQL container and injects its own connection details, which take
# precedence over everything here.
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns the schema, not Hibernate. validate checks at startup that the
# entities match the database but never modifies it — ddl-auto=update would
# quietly bend in the wrong directions and not report what it did.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate is deliberately NOT set. It existed for H2 files created
# before Flyway was introduced, and there are none on PostgreSQL. Leaving it off
# means Flyway refuses to start against a schema that already has tables but no
# history, instead of assuming they are the right ones.

# The views use DTO records rather than entities, so there is no need to keep a
# session open for the duration of rendering.
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Web push notifications
#
# The VAPID key pair identifies this server to the browsers' push services. It
# is a credential: the private key must not be committed, which is why these
# come from the environment and default to empty.
#
# Generate a pair with (no Node needed):
#
#   java tools/generate-vapid-keys.java
#
# Then run with:
#
#   VAPID_PUBLIC_KEY=B... VAPID_PRIVATE_KEY=... \
#   VAPID_SUBJECT=mailto:you@example.com java -jar sensor-hub.jar
#
# With no keys set, notifications are simply unavailable: the switch is hidden
# and everything else works as before. The subject is required by Apple's push
# service and has to be a mailto: or https: URL.
# ----------------------------------------------------------------------------
sensorhub.webpush.public-key=${VAPID_PUBLIC_KEY:}
sensorhub.webpush.private-key=${VAPID_PRIVATE_KEY:}
sensorhub.webpush.subject=${VAPID_SUBJECT:}

logging.level.fi.mstahv.sensorhub=INFO
