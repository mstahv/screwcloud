# ----------------------------------------------------------------------------
# The reader itself
#
# Every value here can be overridden from the environment, which is how the Pi is
# configured: SCREWCLOUD_DEVICE_ID=PIER java -jar pi-reader-runner.jar
# ----------------------------------------------------------------------------

# This reader's identifier, exactly as a microcontroller's DEVICE_ID: 1 to 4
# characters, unique among your devices. It is what the server files the readings
# under, so changing it starts a new device rather than renaming this one.
screwcloud.device-id=PI01

# Where the measurements go. The same UDP port the firmwares send to.
screwcloud.upload.host=r.pakast.in
screwcloud.upload.port=5555

# The same five minutes the firmware uses. The server learns the pace a device
# keeps and warns when one goes quiet, so an unusual interval here only teaches it
# a different normal.
screwcloud.upload.interval=5m

# A tag not heard within this is left out of the packet: it broadcasts every 1.3
# seconds, so a minute of silence means out of range or a flat battery.
screwcloud.upload.stale-after=PT1M

# Set to false to watch the tags locally without reporting anywhere.
screwcloud.upload.enabled=true

# ----------------------------------------------------------------------------
# Bluetooth
# ----------------------------------------------------------------------------

# BlueZ is asked this often for what it has heard. A tag broadcasts every 1.3 s.
screwcloud.ble.poll-interval=PT2S

# Off on a machine with no Bluetooth, where the scanner would only log a warning.
screwcloud.ble.enabled=true

# ----------------------------------------------------------------------------
# Thingy:52
#
# A Nordic Thingy:52 reported as a sensor of its own, alongside the RuuviTags.
#
# Unlike a RuuviTag, this one is connected to: the Thingy's environment
# characteristics are notify-only in Nordic's firmware — not readable, and not in
# the advertisement — so there is no listen-only way to get the temperature. A
# connected Thingy is not available to the phone app at the same time.
# ----------------------------------------------------------------------------
screwcloud.thingy.enabled=true

# Which one, when there is more than one in range. Empty means the first Thingy
# found, which is the ordinary case.
screwcloud.thingy.address=

# How often the last notified value is picked up. This reads a property BlueZ
# already holds rather than asking the device for anything, so it is cheap.
screwcloud.thingy.poll-interval=PT5S

# ----------------------------------------------------------------------------
# LoRa
#
# A second radio, listening for devices too far away for WiFi and relaying what
# they send to the server byte for byte. A device heard this way appears on the
# server as itself rather than as this reader.
#
# Off by default: a Pi with no Core1121 wired to it would only log a warning.
# ----------------------------------------------------------------------------
screwcloud.lora.enabled=true

# These three must match the sending firmware exactly. There is no negotiation in
# LoRa and no error when two ends disagree — a mismatch and a missing antenna
# both sound like silence — so change them here and in the firmware's config.h
# together, one at a time.
#
# The values are those of the link that has been made to work: lora-node.ino's,
# which are Waveshare's example's. SF9 reaches further and costs about four times
# the time in the air; move both ends together once a link is up.
screwcloud.lora.frequency=868000000
screwcloud.lora.spreading-factor=7

# Worth turning on at both ends once the link is proven: without it a corrupt
# packet is relayed to the server as though it were good.
screwcloud.lora.crc=false

# ----------------------------------------------------------------------------
# Names
#
# Empty means ~/.screwcloud-sensors.csv, a hidden file in the home directory of
# whoever runs this. Set a path to keep it somewhere else.
# ----------------------------------------------------------------------------
screwcloud.names.file=

# ----------------------------------------------------------------------------
# HTTP
#
# Bound to every interface so the phone on the sofa can reach it. This has no
# authentication of any kind and belongs on a home network, not on the internet.
# ----------------------------------------------------------------------------
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.log.category."org.vaadin.example".level=INFO

# ----------------------------------------------------------------------------
# Tests
#
# StartupTest boots the real application, so the radios and the upload are
# switched off under test: a test must not open a D-Bus session, drive an SPI bus
# or send a packet to a live server.
#
# Only the switches. Everything that gets *converted* — the addresses, the
# intervals, the frequency — is deliberately left exactly as it is above, because
# a value that cannot be converted is precisely what that test exists to catch.
# ----------------------------------------------------------------------------
%test.screwcloud.ble.enabled=false
%test.screwcloud.lora.enabled=false
%test.screwcloud.thingy.enabled=false
%test.screwcloud.upload.enabled=false
